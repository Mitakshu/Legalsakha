<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.png"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Tools | LegalSakha</title></head><body><section class="sh"><div class="wrap" style="grid-template-columns:1fr"><div><div class="crumb"><a href="index.html">Home</a> / Tools</div><h1 class="split">Tools</h1><p style="margin-top:16px;font-size:18px;color:#4b5563;max-width:620px">Quick helpers to plan your next step.</p></div></div></section><section><div class="wrap"><div class="grid g2"><div class="card rv"><h3>GST calculator</h3><p style="margin-bottom:12px">Enter your amount and the GST rate that applies to your goods or service.</p><form onsubmit="return false"><input id="amt" type="number" placeholder="Amount (₹)" oninput="gst()"><input id="rate" type="number" placeholder="GST rate (%)" oninput="gst()"><select id="mode" onchange="gst()"><option value="ex">Amount excludes GST</option><option value="in">Amount includes GST</option></select></form><p id="gres" style="margin-top:14px;font-weight:700;color:var(--navy)"></p></div>
<div class="card rv"><h3>Which service do I need?</h3><p style="margin-bottom:12px">Pick your goal and we will point you to the right page.</p><select id="goal" onchange="goal()"><option value="">Choose your goal</option><option value="private-limited-company">I want to start a company</option><option value="llp-registration">I want to start a partnership with limited liability</option><option value="gst">I want to sell or buy goods across states</option><option value="trademark">I want to protect my brand name</option><option value="import-export-code">I want to import or export</option><option value="fssai">I want a food business</option><option value="funding-support">I need funding for my business</option><option value="accounting">I need to keep my accounts in order</option></select><p id="gout" style="margin-top:14px"></p></div></div></div></section><script src="app.js"></script><script>shell();window.gst=()=>{const a=+$('#amt').value,r=+$('#rate').value,m=$('#mode').value;if(!a||isNaN(r)){$('#gres').textContent='';return}const base=m=='ex'?a:a/(1+r/100),g=base*r/100;$('#gres').innerHTML='Base: ₹'+base.toFixed(2)+'<br>GST: ₹'+g.toFixed(2)+'<br>Total: ₹'+(base+g).toFixed(2)};window.goal=()=>{const v=$('#goal').value,s=S.find(x=>x[1]==v);$('#gout').innerHTML=s?'<a class="btn p s" href="'+v+'.html" style="color:#fff">View '+s[2]+'</a>':''};fx();</script></body></html>
